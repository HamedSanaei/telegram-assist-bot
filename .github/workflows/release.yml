name: Release image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/hamedsanaei/telegram-assist-bot

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Telegram Assist Bot
            org.opencontainers.image.description=Telegram channel administration assistant
            org.opencontainers.image.version=1.0.0

      - name: Build and optionally publish multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=1.0.0
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Attest published image
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Assemble public release bundle
        run: |
          mkdir telegram-assist-bot-v1.0.0
          cp compose.yaml install.sh install.ps1 telegram-assist-bot-v1.0.0/
          cp config/configuration.example.json telegram-assist-bot-v1.0.0/
          cp docs/RELEASE_CHECKLIST.md telegram-assist-bot-v1.0.0/RELEASE_CHECKLIST.md
          tar -czf telegram-assist-bot-v1.0.0.tar.gz telegram-assist-bot-v1.0.0
          sha256sum telegram-assist-bot-v1.0.0.tar.gz > SHA256SUMS
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: telegram-assist-bot-v1.0.0-release-assets
          path: |
            telegram-assist-bot-v1.0.0.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14
